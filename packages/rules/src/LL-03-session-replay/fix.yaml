# Fix guidance for a coding agent. Each step tells why. Thus the agent can
# change the step when the repo does not have the expected shape.
ruleId: LL-03
fixType: full
goal: >-
  Make sure that the session replay tool records nothing before the site tells
  the visitor about the recording and the visitor agrees to it. After that,
  the tool must mask the input that the visitor types.

steps:
  - title: Find the location where the replay tool starts
    why: >-
      The recording starts when the code initialises the SDK. Thus that call
      must have a consent gate. If you remove the call at other locations but
      it still runs here, the problem stays.
    instructions: >-
      Open each location in the finding. Each location is one of these:
      FullStory.init, Hotjar.init or hotjar.initialize, LogRocket.init,
      Clarity.init, posthog.init or <PostHogProvider>, or a snippet script tag.
      Make sure that no other code in the repo starts the same tool.

  - title: Start the tool only after consent
    why: >-
      The trap is a recording that starts before the site tells the visitor.
      Code that runs when the page loads must not start the tool. Only an
      explicit "accept" can start it.
    instructions: >-
      Move the initialisation into the callback that runs when the visitor
      accepts analytics or recording in the cookie banner. On subsequent page
      loads, run it only when the stored consent is yes. If the project has no
      banner, add a small banner. The banner keeps the choice, for example in
      localStorage or a cookie. On accept, it calls an `initReplay()` function.
      Put the init call in a condition or callback with a name that clearly
      shows the consent check. Examples are `if (hasConsent('analytics'))` and
      `onConsent(...)`.
    variants:
      next-app: >-
        Initialise in a 'use client' component that app/layout.tsx renders. Do
        the initialisation in a useEffect. The useEffect must return before the
        initialisation if there is no consent. Put the consent state in its
        dependency list.
      next-pages: >-
        Initialise in pages/_app.tsx in a useEffect. The useEffect must return
        before the initialisation if there is no consent. Put the consent state
        in its dependency list.
      vite-react: >-
        Move the init from src/main.tsx into the accept handler of the banner.
        At startup, call it only when the stored consent is yes.
      plain-html: >-
        Change the script tag of the snippet to type="text/plain". Add the
        category attribute of your consent manager. Examples are
        data-cookieconsent="statistics" for Cookiebot and
        data-category="analytics" for vanilla-cookieconsent. Thus the browser
        does not run the script before the manager enables it.

  - title: For PostHog, keep the recording off before consent
    why: >-
      PostHog can capture analytics and recordings separately. This rule is
      about the recording.
    instructions: >-
      Use one of these two methods. Method 1: initialise PostHog with
      `opt_out_capturing_by_default: true`, and call
      `posthog.opt_in_capturing()` on accept. Method 2: initialise with
      `disable_session_recording: true`, and call
      `posthog.startSessionRecording()` on accept.

  - title: Turn on input masking
    why: >-
      Also after consent, a recording of the text that visitors type into
      forms captures too much data. This data includes passwords and card
      details.
    instructions: >-
      Enable the input masking of the tool. For PostHog, set
      `session_recording: { maskAllInputs: true }`. For LogRocket, set
      `dom: { inputSanitizer: true }`. Clarity and Hotjar mask inputs by
      default. Do not turn this off. For FullStory, add the `fs-mask` class to
      sensitive fields, or enable private-by-default.

  - title: Tell visitors about the recording
    why: >-
      The trap is a recording that starts before the site tells the visitor.
      The site tells the visitor in the banner and in the privacy policy.
    instructions: >-
      Add a line to the consent banner, such as "We record how you use this site
      (clicks, scrolling, page changes) to improve it, only if you agree.". In
      the privacy policy, add the name of the replay tool to the list of
      service providers.

doneWhen:
  - "No code initialises a replay SDK when the page loads, outside a consent callback or a consent check."
  - "Input masking is on for the replay tool."
  - "The banner and the privacy policy tell about session recording."
  - "A repo re-scan shows no LL-03 finding."
  - "If a preview URL exists, a URL scan shows no requests to replay recording endpoints when the page loads for the first time."

ownerSteps: []
