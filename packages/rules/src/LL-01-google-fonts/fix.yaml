# Fix guidance for a coding agent. Each step tells why. Thus the agent can
# change the step when the repo does not have the expected shape.
ruleId: LL-01
fixType: full
goal: >-
  Serve all fonts from the site's own domain. When a page loads, the browser of
  a visitor must not connect to fonts.googleapis.com or fonts.gstatic.com. You
  can keep the same fonts. Only the location that the fonts come from changes.

steps:
  - title: Make a list of the fonts that the site loads from Google
    why: >-
      The replacement must load the same families and weights. If not, the
      appearance of the site changes and the owner will not accept the fix.
    instructions: >-
      Open each location in the finding. Read the family names and weights in
      the Google URL. For example, `family=Inter:wght@400;700` means Inter at
      400 and 700. For webfontloader, read the `google.families` list.

  - title: Self-host the same fonts
    why: >-
      With self-hosting, the build downloads the font files and the site serves
      them from its own domain. Thus the IP address of the visitor does not go
      to Google.
    instructions: >-
      If the framework has built-in self-hosting, use it. If not, install the
      applicable @fontsource package for each family. Import each package one
      time from the entry point of the app.
    variants:
      next-app: >-
        In app/layout.tsx, import the family from `next/font/google`. For
        example: `import { Inter } from 'next/font/google'`. Create the font
        with the necessary `weight` and `subsets`. Add its `className` (or
        `variable`) to the <html> or <body> element. The import path contains
        "google", but next/font downloads the files when you build. It then
        serves the files from your domain.
      next-pages: >-
        In pages/_app.tsx, import the family from `next/font/google`. If
        pages/_app.tsx does not exist, create it. Create the font with the
        necessary `weight` and `subsets`. Put the page in an element that has
        its `className`, or apply its `variable` in a global style. Do not load
        fonts in pages/_document.tsx.
      vite-react: >-
        Install `@fontsource/<family>`. For variable fonts, install
        `@fontsource-variable/<family>`. Import the necessary weights in
        src/main.tsx. For example: `import '@fontsource/roboto/400.css'`.
      remix: >-
        Install `@fontsource/<family>`. Import the CSS from app/root.tsx. As an
        alternative, add the CSS to the `links` export. Use the CSS URL of the
        package that the bundler resolves.
      plain-html: >-
        Download the .woff2 files for the necessary weights. Put them in the
        site, for example in /fonts/. Declare them with @font-face rules. Each
        `src: url()` must point to these local files.

  - title: Remove all references to the Google font hosts
    why: >-
      The site now serves the fonts locally. The old tags only add the Google
      request again. A preconnect to Google also opens a connection that shows
      the IP address of the visitor, also when no file downloads.
    instructions: >-
      Delete the `<link rel="stylesheet">`, `<link rel="preload">` and
      `<link rel="preconnect">` tags that point to fonts.googleapis.com or
      fonts.gstatic.com. Delete each CSS `@import` of these hosts. Delete each
      @font-face `src: url()` on fonts.gstatic.com. Delete each webfontloader
      call that has a `google` key. If no other code uses webfontloader,
      uninstall it.

  - title: Change the font-family rules to use the self-hosted font
    why: >-
      next/font and some @fontsource packages give a different family name or a
      CSS variable. If the CSS still uses the old family name, the text changes
      to a system font and no error shows.
    instructions: >-
      Find the family names from step 1 in the CSS and in the Tailwind config.
      Replace them with the name or CSS variable that the self-hosted font
      gives.

doneWhen:
  - "No shipped file links to, imports from, or preconnects to fonts.googleapis.com or fonts.gstatic.com. Mentions in comments, tests and docs are permitted."
  - "The site loads the fonts from step 1 from its own domain."
  - "A repo re-scan shows no LL-01 finding."
  - "If a preview URL exists, a URL scan shows no requests to the two Google font hosts when the page loads for the first time."

ownerSteps: []
