# Fix guidance for a coding agent. Each step tells why. Thus the agent can
# change the step when the repo does not have the expected shape.
ruleId: LL-02
fixType: full
goal: >-
  Each marketing email has an unsubscribe link that operates correctly and the
  postal address of the sender. The code records each unsubscribe. Each
  marketing send does not go to persons who unsubscribed. Do not change
  transactional email (receipts, password resets).

steps:
  - title: Add a shared email footer
    why: >-
      All marketing templates use one footer component. Thus no template can
      ship without the unsubscribe link and the address. The re-scan also finds
      the two items in each template.
    instructions: >-
      Create an EmailFooter component. Use the same format as the templates:
      React Email, an MJML partial or an HTML snippet. The footer must have an
      "Unsubscribe" link to the unsubscribe route, with a token for each
      recipient. The footer must also have the postal address of the company.
      If the owner did not give the address, use a placeholder such as
      [COMPANY POSTAL ADDRESS]. Render the footer at the bottom of each
      marketing template. For templates that the email provider hosts, add the
      unsubscribe placeholder of the provider. The placeholders are: Resend
      `{{{RESEND_UNSUBSCRIBE_URL}}}`, SendGrid
      `<%asm_group_unsubscribe_raw_url%>`, Postmark `{{{ pm:unsubscribe }}}`,
      Mailgun `%unsubscribe_url%`.

  - title: Add a one-click unsubscribe route
    why: >-
      The link must operate without a login. The code must keep the choice in
      a location that the sender reads. If not, persons continue to get email
      after they unsubscribe.
    instructions: >-
      Add a route at /unsubscribe. GET shows a confirmation. POST does the
      unsubscribe. The route must verify a signed token that identifies the
      recipient. Then it sets an `unsubscribed` flag for that email address,
      or it adds a row to a `suppressions` table. The column or table name
      must contain "unsubscribed" or "suppress". Thus the re-scan can match the
      code that writes the choice with the code that reads it.
    variants:
      next-app: Create app/unsubscribe/page.tsx for the confirmation. Create app/api/unsubscribe/route.ts for the POST.
      next-pages: Create pages/unsubscribe.tsx and pages/api/unsubscribe.ts.
      node-server: Register GET and POST /unsubscribe on the server router.
      remix: Create app/routes/unsubscribe.tsx with a loader and an action.

  - title: Remove unsubscribed addresses before each marketing send
    why: >-
      An unsubscribe link is only important if the next send obeys it.
    instructions: >-
      Find the code that makes the list of marketing recipients, or a shared
      send wrapper. In that code, remove the addresses that have the
      `unsubscribed` flag or that are in `suppressions`. Use the same name that
      the unsubscribe route writes. The email provider can do this step if you
      send through Resend audiences or broadcasts, SendGrid ASM groups or a
      Postmark broadcast stream. In that case, give the audience or group id
      with each marketing send.

  - title: Add List-Unsubscribe headers
    why: >-
      Gmail and Yahoo make bulk senders give one-click unsubscribe headers.
      With these headers, mail clients show their own unsubscribe button.
    instructions: >-
      On marketing sends, set `List-Unsubscribe: <https://your-domain/api/unsubscribe?token=...>`
      and `List-Unsubscribe-Post: List-Unsubscribe=One-Click`. Use the same
      token as the footer link.

doneWhen:
  - "Each marketing template renders an unsubscribe link and a postal address."
  - "An unsubscribe route records the choice under a name that contains unsubscribed or suppress."
  - "Each marketing send removes unsubscribed addresses, or uses an audience or group that the provider manages."
  - "A repo re-scan shows no LL-02 finding."

ownerSteps: []
