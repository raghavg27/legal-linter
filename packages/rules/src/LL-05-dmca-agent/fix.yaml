# Fix guidance for a coding agent. Each step tells why. Thus the agent can
# change the step when the repo does not have the expected shape.
ruleId: LL-05
fixType: partial
goal: >-
  Publish a DMCA policy page that gives the name and the contact details of a
  designated agent. Give rights holders a method to send takedown requests.
  Give a repeat-infringer policy. Then the owner registers the same agent with
  the US Copyright Office.

steps:
  - title: Add a DMCA policy page at /dmca
    why: >-
      Rights holders must find the person who gets copyright notices. They look
      for a stable /dmca route with a link in the footer. The re-scan also
      looks for this route.
    instructions: >-
      Create a page with these sections. "Designated agent": the name, postal
      address, phone and email. If the owner did not give these details, use
      placeholders such as [AGENT NAME]. "How to send a notice": the items that
      a notice must have. These are the work, the location of the work on the
      site, contact details, a good-faith statement and a signature.
      "Counter-notices": how a user can reply if the site removed their content
      by mistake. "Repeat infringers": the policy from the next step. Use plain
      language. The owner can make the text better.
    variants:
      next-app: Create app/dmca/page.tsx.
      next-pages: Create pages/dmca.tsx.
      vite-react: Add a /dmca route in the router and a Dmca page component.
      remix: Create app/routes/dmca.tsx.
      plain-html: Create dmca.html next to index.html.
      node-server: Serve the page at GET /dmca from the server templates.

  - title: Add a method to send a takedown request
    why: >-
      If it is easy to send notices, the agent quickly gets reports of
      infringing uploads. Thus the reports do not become claims.
    instructions: >-
      On the /dmca page, add a short form that collects the fields under "How
      to send a notice". As an alternative, add a mailto link to the email of
      the agent. If the app has an admin area, add a method to remove or
      disable an upload that a person reported.

  - title: Give a repeat-infringer policy
    why: >-
      Users must know what occurs to accounts that upload infringing content
      many times. The app must also have a method to do this action.
    instructions: >-
      Add the policy to the /dmca page and to the terms of service. For
      example: the site suspends accounts that get valid notices many times.
      If the app has accounts, make sure that an admin can suspend an account.

  - title: Link to the page from the footer and the terms
    why: >-
      If nobody can find the page, it does not help rights holders to contact
      the agent.
    instructions: >-
      Add a "DMCA" or "Copyright" link to the footer of the site. In the terms
      of service, add a reference to the page.

doneWhen:
  - "A page at a route that contains dmca or copyright gives the name of the designated agent and a contact email."
  - "The footer has a link to that page."
  - "After the owner registers the agent, legal-lint.config.json has intake.dmcaAgentRegistered set to true."
  - "A repo re-scan shows no LL-05 finding."

ownerSteps:
  - title: Register the designated agent with the US Copyright Office
    why: >-
      The trap is an agent that is not registered or not listed. The owner
      registers the agent in the online system of the Copyright Office ($6,
      renewed every 3 years). After that, set intake.dmcaAgentRegistered to
      true in legal-lint.config.json.
  - title: Write the real contact details of the agent
    why: >-
      If the /dmca page has placeholders, rights holders have no person to
      contact. Use the same details as the Copyright Office registration.
  - title: Confirm the text of the repeat-infringer and counter-notice policies
    why: >-
      These policies tell how the owner will act on notices. Thus the owner
      must confirm that they agree with the actions that will really occur.
